<!DOCTYPE html>
<html>
  <head>
    <link href="css/style.css" rel="stylesheet" type="text/css" />
    <meta charset="utf-8">
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link href="https://fonts.googleapis.com/css?family=DM+Sans&display=swap" rel="stylesheet">
    <title>Fisheye - photographe </title>
  </head>
  <body>
    <header>
      <a href="/" aria-label="Retour à la page d'accueil FishEye">
        <img src="assets/images/logo.png" class="logo" alt="FishEye Home Page" />
      </a>
    </header>
    <main id="main">
      <div class="photograph-header">
        <button class="contact_button" onclick="displayModal()" tabindex="0" aria-label="Contactez-moi">Contactez-moi</button>
      </div>
    </main>
    <div id="contact_modal" role="dialog" aria-labelledby="modal-title" aria-hidden="true" aria-modal="true">
			<div class="modal">
				<header>
          <h2 id="modal-title">Contactez-moi</h2>
          <button type="button" onclick="closeModal()" tabindex="0" aria-label="Fermer la boîte de dialogue">
            <img src="assets/icons/close.svg" alt="Fermer" />
          </button>
        </header>
				<form>
					<div>
						<label for="first-name">Prénom</label>
						<input id="first-name" type="text" tabindex="0" aria-label="Saisissez votre prénom" />
					</div>
          <button class="contact_button" type="submit" tabindex="0" aria-label="Envoyer le message de contact">Envoyer</button>
				</form>
			</div>
		</div>
    <script src="/scripts/factories/mediaFactory.js"></script>
    <script src="/scripts/pages/photographer.js"></script>
    <script src="/scripts/utils/contactForm.js"></script>
  </body>
</html>
