<!DOCTYPE html>
<html lang="fr">
  <head>
    <link href="css/style.css" rel="stylesheet" type="text/css" />
    <link href="css/modal.css" rel="stylesheet" type="text/css" />
    <meta charset="utf-8">
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link href="https://fonts.googleapis.com/css?family=DM+Sans&display=swap" rel="stylesheet">
    <title>Fisheye - photographe </title>
  </head>
  <body>
    <header>
      <a href="/" aria-label="Retour à la page d'accueil FishEye">
        <img src="assets/images/logo.png" class="logo" alt="FishEye Home Page" />
      </a>
    </header>
    <main id="main">
      <div class="photograph-header">
        <button class="contact_button" onclick="displayModal()" tabindex="0" aria-label="Contactez-moi">Contactez-moi</button>
      </div>
    </main>
    <div id="contact_modal" role="dialog" aria-labelledby="modal-title" aria-hidden="true" aria-modal="true">
			<div class="modal">
				<header>
          <h2 id="modal-title">Contactez-moi<br><span id="photographer-name-modal"></span></h2>
          <button type="button" onclick="closeModal()" tabindex="0" aria-label="Fermer la boîte de dialogue">
            <img src="assets/icons/close.svg" alt="Fermer" />
          </button>
        </header>
				<form id="contact-form" aria-labelledby="modal-title">
					<div class="form-group">
						<label for="first-name">Prénom</label>
						<input id="first-name" name="firstName" type="text" aria-describedby="first-name-help" aria-required="true" required />
						<span id="first-name-help" class="sr-only">Champ obligatoire pour votre prénom</span>
					</div>
					<div class="form-group">
						<label for="last-name">Nom</label>
						<input id="last-name" name="lastName" type="text" aria-describedby="last-name-help" aria-required="true" required />
						<span id="last-name-help" class="sr-only">Champ obligatoire pour votre nom de famille</span>
					</div>
					<div class="form-group">
						<label for="email">Email</label>
						<input id="email" name="email" type="email" aria-describedby="email-help" aria-required="true" required />
						<span id="email-help" class="sr-only">Champ obligatoire pour votre adresse email</span>
					</div>
					<div class="form-group">
						<label for="message">Votre message</label>
						<textarea id="message" name="message" aria-describedby="message-help" aria-required="true" required></textarea>
						<span id="message-help" class="sr-only">Champ obligatoire pour votre message au photographe</span>
					</div>
          <button class="contact_button" type="submit" aria-label="Envoyer votre message de contact au photographe">Envoyer</button>
				</form>
			</div>
		</div>
    <script src="/scripts/templates/photographer.js"></script>
    <script src="/scripts/factories/mediaFactory.js"></script>
    <script src="/scripts/pages/photographer.js"></script>
    <script src="/scripts/utils/contactForm.js"></script>
    <script src="lightbox.js"></script>
  </body>
</html>
